name: release

on:
  push:
    tags:
      - "*"

# One run per tag. A tag pushed from git and a release created in the GitHub UI
# (which creates its tag) both land here; the last job makes sure the tag has a
# GitHub Release, so tags and releases always match.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build the web UI once for every binary
        run: bun install --frozen-lockfile --ignore-scripts && cd ui && bunx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  # Each target builds on a runner of its own kind (CGO for sqlite and the Windows tray)
  binaries:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux_x86_64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: Linux_arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - name: Linux_armv7_RaspberryPi
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          - name: Windows_x86_64
            runner: windows-latest
            goos: windows
            goarch: amd64
            main: ./pkg/tray
            ldflags: -H windowsgui
          - name: macOS_arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - name: macOS_x86_64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - name: Install the cross compiler
        if: matrix.apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
        run: |
          [ -z "$CC" ] && unset CC
          [ -z "$GOARM" ] && unset GOARM
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ matrix.ldflags }}"
          mkdir -p pkg_out
          go build -tags=json1 -trimpath -ldflags "$ldflags" -o "pkg_out/xbvr${ext}" ${{ matrix.main || '.' }}
      - name: Package
        run: |
          cp -r xbvr_data README.md pkg_out/
          archive="xbvr_${GITHUB_REF_NAME}_${{ matrix.name }}"
          mkdir -p dist
          cd pkg_out
          if [ "${{ matrix.goos }}" = linux ]; then
            tar czf "../dist/${archive}.tar.gz" .
          elif [ "${{ matrix.goos }}" = windows ]; then
            7z a -tzip "../dist/${archive}.zip" . >/dev/null
          else
            zip -qr "../dist/${archive}.zip" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # one argument per digest file is intended
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}

  github-release:
    runs-on: ubuntu-latest
    needs: [merge, binaries]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Create the GitHub Release for this tag if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created in the UI); keeping its notes."
            exit 0
          fi
          image="${REGISTRY_IMAGE}:${TAG}"
          # shellcheck disable=SC2016 # the backticks are literal markdown
          printf 'Docker image: `%s`\n\n```\ndocker pull %s\n```\n' "$image" "$image" > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-file notes.md

      - name: Attach the binaries and their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- * > checksums.txt
          gh release upload "$TAG" -- * --clobber
